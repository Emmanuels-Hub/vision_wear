name: vision_wear
description: "AI-powered eyewear assistant connecting to ESP32-CAM for obstacle and object detection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  vibration: ^2.0.1
  intl: ^0.20.1
  camera: ^0.11.0+2
  path_provider: ^2.1.5
  path: ^1.9.1
  ultralytics_yolo: ^0.6.5
  google_mlkit_text_recognition: ^0.15.1
  wakelock_plus: ^1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Generates the Android launcher icons from assets/icon/.
# Regenerate after changing the logo with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Adaptive icon: Android masks the outer edge of the foreground, so the logo
  # is inset inside its own safe zone and the brand colour fills the rest.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
   - assets/labels.txt
   - assets/model.tflite
   - assets/logo.png
